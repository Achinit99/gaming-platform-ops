apiVersion: apps/v1
kind: Deployment
metadata:
  name: gaming-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gaming-backend
  template:
    metadata:
      labels:
        app: gaming-backend
    spec:
      containers:
      - name: backend
        image: achinit99/gaming-backend:latest
        ports:
        - containerPort: 4000 # NestJS port
        env:
        - name: PORT
          value: "4000"
        - name: SUPABASE_URL
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: SUPABASE_URL
        - name: SUPABASE_KEY
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: SUPABASE_KEY