apiVersion: apps/v1
kind: Deployment
metadata:
  name: gaming-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gaming-backend
  template:
    metadata:
      labels:
        app: gaming-backend
    spec:
      containers:
        - name: backend
          image: achinit99/gaming-backend:v1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 4000 # NestJS port
          env:
            - name: PORT
              value: "4000"
            - name: FRONTEND_URL
              value: "http://139.59.220.121"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DATABASE_URL
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SUPABASE_URL
            - name: SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SUPABASE_ANON_KEY
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SUPABASE_SERVICE_ROLE_KEY